<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>방문자 통계 | STN 관리자</title>
  <link rel="icon" type="image/x-icon" href="/image/favicon-512x512-256.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <img src="/image/favicon-512x512.png" alt="STN">
        <div>
          <strong>STN Admin</strong>
          <span>스킬업 운영</span>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="관리자 메뉴">
        <a class="nav-item" href="dashboard.html">결제 신청 관리</a>
        <a class="nav-item" href="referrals.html">추천인 코드</a>
        <a class="nav-item is-active" href="visitors.html">방문자 통계</a>
        <a class="nav-item" href="../index.html" target="_blank" rel="noopener noreferrer">사이트 보기</a>
      </nav>

      <div class="sidebar-footer">
        <div id="admin-user-email">-</div>
        <button type="button" class="btn btn-ghost" id="logout-btn" style="width:100%; margin-top:10px;">로그아웃</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="demo-banner" id="demo-banner" hidden>
        데모 모드입니다. 아래 방문자 데이터는 샘플입니다.
      </div>

      <header class="admin-topbar">
        <div>
          <h2>방문자 통계</h2>
          <p>페이지뷰·순방문자·기기·접속경로를 확인합니다.</p>
        </div>
        <button type="button" class="btn btn-ghost" id="refresh-btn">새로고침</button>
      </header>

      <section class="stats-grid stats-grid-6" aria-label="방문 요약">
        <article class="stat-card">
          <span>오늘 방문(페이지뷰)</span>
          <strong id="stat-views-today">0</strong>
        </article>
        <article class="stat-card">
          <span>오늘 순방문자</span>
          <strong id="stat-unique-today">0</strong>
        </article>
        <article class="stat-card">
          <span>주간(7일) 페이지뷰</span>
          <strong id="stat-views-week">0</strong>
        </article>
        <article class="stat-card">
          <span>주간 순방문자</span>
          <strong id="stat-unique-week">0</strong>
        </article>
        <article class="stat-card">
          <span>월간(30일) 페이지뷰</span>
          <strong id="stat-views-month">0</strong>
        </article>
        <article class="stat-card">
          <span>월간 순방문자</span>
          <strong id="stat-unique-month">0</strong>
        </article>
      </section>

      <section class="panel" style="margin-bottom:18px;">
        <div class="panel-head panel-head-tabs">
          <h3>방문 추이</h3>
          <div class="period-tabs" role="tablist" aria-label="방문 추이 기간">
            <button type="button" class="period-tab is-active" id="chart-period-week" role="tab" aria-selected="true">주간</button>
            <button type="button" class="period-tab" id="chart-period-month" role="tab" aria-selected="false">월간</button>
          </div>
        </div>
        <div class="chart-grid" id="visitor-chart" aria-label="일별 방문 차트"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h3>최근 방문 기록</h3>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>시간</th>
                <th>경로</th>
                <th>페이지</th>
                <th>기기</th>
                <th>접속경로</th>
                <th>방문자 ID</th>
              </tr>
            </thead>
            <tbody id="recent-views-body">
              <tr><td colspan="6" class="table-empty">불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="visits-pagination" hidden aria-label="방문 기록 페이지">
          <button type="button" class="page-btn" id="visits-page-prev" aria-label="이전 페이지">이전</button>
          <div class="page-numbers" id="visits-page-numbers"></div>
          <button type="button" class="page-btn" id="visits-page-next" aria-label="다음 페이지">다음</button>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/visitors.js"></script>
  <script>
    window.stnAdminVisitors.init().catch(function (err) {
      console.error(err);
    });
  </script>
</body>
</html>
