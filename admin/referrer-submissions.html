<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>추천인 코드 신청자 | STN 관리자</title>
  <link rel="icon" type="image/x-icon" href="/image/favicon-512x512-256.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <img src="/image/favicon-512x512.png" alt="STN">
        <div>
          <strong>STN Admin</strong>
          <span>스킬업 운영</span>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="관리자 메뉴">
        <a class="nav-item" href="dashboard.html">결제 신청 관리</a>
        <a class="nav-item is-active" href="referrer-submissions.html">추천인 코드 신청자</a>
        <a class="nav-item" href="referrals.html">할인코드 관리</a>
        <a class="nav-item" href="visitors.html">방문자 통계</a>
        <a class="nav-item" href="../index.html" target="_blank" rel="noopener noreferrer">사이트 보기</a>
      </nav>

      <div class="sidebar-footer">
        <div id="admin-user-email">-</div>
        <button type="button" class="btn btn-ghost" id="logout-btn" style="width:100%; margin-top:10px;">로그아웃</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <h2 id="dashboard-title">추천인 코드 신청자</h2>
          <p id="dashboard-desc">결제 신청 시 추천인 코드를 입력한 내역만 표시합니다.</p>
        </div>
        <div class="admin-topbar-actions">
          <button type="button" class="btn btn-ghost" id="refresh-btn">새로고침</button>
          <button type="button" class="btn btn-ghost" data-logout>로그아웃</button>
        </div>
      </header>

      <section class="stats-grid" aria-label="요약 통계">
        <article class="stat-card">
          <span>추천인 코드 입력</span>
          <strong id="stat-total">0</strong>
        </article>
        <article class="stat-card">
          <span>결제 완료</span>
          <strong id="stat-paid">0</strong>
        </article>
        <article class="stat-card">
          <span>대기</span>
          <strong id="stat-pending">0</strong>
        </article>
        <article class="stat-card">
          <span>완료 금액 합계</span>
          <strong id="stat-amount">0원</strong>
        </article>
      </section>

      <section class="panel">
        <div class="panel-head panel-head-tabs">
          <h3>신청 내역</h3>
          <div class="period-tabs dashboard-view-tabs" id="dashboard-view-tabs" role="tablist" aria-label="신청 내역 보기">
            <a class="period-tab" href="dashboard.html" data-dashboard-view="all">전체</a>
            <a class="period-tab is-active" href="referrer-submissions.html" data-dashboard-view="referrer-only" aria-current="page">추천인 코드 입력</a>
          </div>
        </div>

        <form id="applications-filter" class="applications-filter" autocomplete="off">
          <div class="filter-grid">
            <div class="filter-field">
              <label for="filter-name">이름</label>
              <input type="text" id="filter-name" class="filter-input" placeholder="이름 검색">
            </div>
            <div class="filter-field">
              <label for="filter-phone-suffix">연락처 뒷자리</label>
              <input type="text" id="filter-phone-suffix" class="filter-input" inputmode="numeric" maxlength="4" placeholder="예: 5678" pattern="[0-9]*">
            </div>
            <div class="filter-field">
              <label for="filter-status">상태</label>
              <select id="filter-status" class="filter-input">
                <option value="">전체</option>
                <option value="pending">대기</option>
                <option value="paid">결제완료</option>
                <option value="failed">실패</option>
                <option value="cancelled">취소</option>
              </select>
            </div>
            <div class="filter-field" id="filter-referrer-field" hidden>
              <label for="filter-referrer">추천인 코드</label>
              <select id="filter-referrer" class="filter-input">
                <option value="">전체</option>
                <option value="has" selected>입력됨</option>
                <option value="none">없음</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="filter-referrer-text">추천인 코드 검색</label>
              <input type="text" id="filter-referrer-text" class="filter-input" placeholder="코드 검색">
            </div>
            <div class="filter-field">
              <label for="filter-date-from">시작일</label>
              <div class="date-input-wrap">
                <input type="date" id="filter-date-from" class="filter-input date-input">
                <button type="button" class="date-open-btn" aria-label="시작일 달력 열기" data-for="filter-date-from">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
                    <path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                  </svg>
                </button>
              </div>
            </div>
            <div class="filter-field">
              <label for="filter-date-to">종료일</label>
              <div class="date-input-wrap">
                <input type="date" id="filter-date-to" class="filter-input date-input">
                <button type="button" class="date-open-btn" aria-label="종료일 달력 열기" data-for="filter-date-to">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
                    <path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                  </svg>
                </button>
              </div>
            </div>
            <div class="filter-actions">
              <button type="submit" class="btn btn-primary">조회</button>
              <button type="button" class="btn btn-ghost" id="filter-reset">초기화</button>
            </div>
          </div>
          <p class="filter-result" id="filter-result-text" hidden></p>
        </form>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>신청일</th>
                <th>이름</th>
                <th>연락처</th>
                <th>과정</th>
                <th>금액</th>
                <th>결제수단</th>
                <th>추천인 코드</th>
                <th>상태</th>
                <th>주문번호</th>
              </tr>
            </thead>
            <tbody id="applications-body">
              <tr>
                <td colspan="9" class="table-empty">데이터를 불러오는 중...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="applications-pagination" hidden aria-label="신청 내역 페이지">
          <button type="button" class="page-btn" id="page-prev" aria-label="이전 페이지">이전</button>
          <div class="page-numbers" id="page-numbers"></div>
          <button type="button" class="page-btn" id="page-next" aria-label="다음 페이지">다음</button>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/admin-shell.js"></script>
  <script src="assets/js/date-picker.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script>
    window.stnAdminDashboard.init({ view: 'referrer-only' }).catch(function (err) {
      var tbody = document.getElementById('applications-body');
      if (tbody) {
        tbody.innerHTML = '<tr><td colspan="9" class="table-empty">' + (err.message || '초기화 실패') + '</td></tr>';
      }
    });
  </script>
</body>
</html>
