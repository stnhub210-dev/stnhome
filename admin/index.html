<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 로그인 | STN 스킬업</title>
  <link rel="icon" type="image/x-icon" href="/image/favicon-512x512-256.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-login-page">
  <main class="login-card">
    <div class="login-brand">
      <img src="/image/favicon-512x512.png" alt="STN">
      <div>
        <h1>STN 관리자</h1>
        <p>스킬업 아카데미 운영 대시보드</p>
      </div>
    </div>

    <form id="login-form" method="post" action="index.html" onsubmit="return false;" novalidate>
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" autocomplete="username" placeholder="admin@example.com" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호" required>
      </div>
      <button type="submit" class="btn btn-primary">로그인</button>
      <p id="login-message" class="form-message" hidden></p>
    </form>

    <p class="config-note" id="setup-note" hidden>
      Supabase가 아직 연결되지 않았습니다.<br>
      <code>admin/assets/js/config.js</code>에 프로젝트 URL·anon key를 입력한 뒤 배포해 주세요.<br>
      (Supabase 대시보드 → Project Settings → API)
    </p>
  </main>

  <script>
    (function () {
      try {
        var url = new URL(window.location.href);
        var hadAuthParams = url.searchParams.has('email') || url.searchParams.has('password');
        if (hadAuthParams) {
          url.searchParams.delete('email');
          url.searchParams.delete('password');
          window.history.replaceState({}, '', url.pathname + url.search + url.hash);
        }
      } catch (_) {}
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (async function () {
      if (!window.isSupabaseConfigured()) {
        document.getElementById('setup-note').hidden = false;
      }

      await window.stnAdminAuth.redirectIfAuthed();
      window.stnAdminAuth.bindLoginForm(
        document.getElementById('login-form'),
        document.getElementById('login-message')
      );
    })();
  </script>
  <script src="/js/site-protection.js"></script>
</body>
</html>
