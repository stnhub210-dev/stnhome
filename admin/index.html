<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 로그인 | STN 스킬업</title>
  <link rel="icon" type="image/x-icon" href="/image/favicon-512x512-256.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-login-page">
  <main class="login-card">
    <div class="login-brand">
      <img src="/image/favicon-512x512.png" alt="STN">
      <div>
        <h1>STN 관리자</h1>
        <p>스킬업 아카데미 운영 대시보드</p>
      </div>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" autocomplete="username" placeholder="admin@example.com" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호" required>
      </div>
      <button type="submit" class="btn btn-primary">로그인</button>
      <button type="button" class="btn btn-demo" id="demo-enter-btn" hidden>데모로 바로 입장</button>
      <p id="login-message" class="form-message" hidden></p>
    </form>

    <p class="config-note" id="demo-note" hidden>
      <strong>임시 데모 모드</strong><br>
      이메일: <code>demo@stnmedia.kr</code><br>
      비밀번호: <code>stnadmin</code>
    </p>

    <p class="config-note" id="setup-note">
      Supabase 연동 시 <code>config.js</code>에 URL·anon key 입력 후
      <code>demoMode: false</code> 로 변경하세요.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (async function () {
      var cfg = window.STN_ADMIN_CONFIG || {};
      if (cfg.demoMode) {
        document.getElementById('demo-note').hidden = false;
        document.getElementById('demo-enter-btn').hidden = false;
        document.getElementById('email').value = cfg.demoEmail || '';
        window.stnAdminAuth.bindDemoEnter(document.getElementById('demo-enter-btn'));
      }

      await window.stnAdminAuth.redirectIfAuthed();
      window.stnAdminAuth.bindLoginForm(
        document.getElementById('login-form'),
        document.getElementById('login-message')
      );
    })();
  </script>
</body>
</html>
