<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 대시보드 | STN 스킬업</title>
  <link rel="icon" type="image/x-icon" href="/image/favicon-512x512-256.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <img src="/image/favicon-512x512.png" alt="STN">
        <div>
          <strong>STN Admin</strong>
          <span>스킬업 운영</span>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="관리자 메뉴">
        <a class="nav-item is-active" href="dashboard.html">결제 신청 관리</a>
        <a class="nav-item" href="referrals.html">추천인 코드</a>
        <a class="nav-item" href="visitors.html">방문자 통계</a>
        <a class="nav-item" href="../index.html" target="_blank" rel="noopener noreferrer">사이트 보기</a>
      </nav>

      <div class="sidebar-footer">
        <div id="admin-user-email">-</div>
        <button type="button" class="btn btn-ghost" id="logout-btn" style="width:100%; margin-top:10px;">로그아웃</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="demo-banner" id="demo-banner" hidden>
        데모 모드입니다. 아래 데이터는 샘플이며 실제 DB와 연결되지 않았습니다.
      </div>

      <header class="admin-topbar">
        <div>
          <h2>결제 신청 관리</h2>
          <p>Supabase에 저장된 수강 신청·결제 내역을 확인합니다.</p>
        </div>
        <button type="button" class="btn btn-ghost" id="refresh-btn">새로고침</button>
      </header>

      <section class="stats-grid" aria-label="요약 통계">
        <article class="stat-card">
          <span>전체 신청</span>
          <strong id="stat-total">0</strong>
        </article>
        <article class="stat-card">
          <span>결제 완료</span>
          <strong id="stat-paid">0</strong>
        </article>
        <article class="stat-card">
          <span>대기</span>
          <strong id="stat-pending">0</strong>
        </article>
        <article class="stat-card">
          <span>완료 금액 합계</span>
          <strong id="stat-amount">0원</strong>
        </article>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h3>최근 신청 내역</h3>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>신청일</th>
                <th>이름</th>
                <th>연락처</th>
                <th>과정</th>
                <th>금액</th>
                <th>결제수단</th>
                <th>상태</th>
                <th>주문번호</th>
              </tr>
            </thead>
            <tbody id="applications-body">
              <tr>
                <td colspan="8" class="table-empty">데이터를 불러오는 중...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="applications-pagination" hidden aria-label="신청 내역 페이지">
          <button type="button" class="page-btn" id="page-prev" aria-label="이전 페이지">이전</button>
          <div class="page-numbers" id="page-numbers"></div>
          <button type="button" class="page-btn" id="page-next" aria-label="다음 페이지">다음</button>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script>
    window.stnAdminDashboard.init().catch(function (err) {
      var tbody = document.getElementById('applications-body');
      if (tbody) {
        tbody.innerHTML = '<tr><td colspan="8" class="table-empty">' + (err.message || '초기화 실패') + '</td></tr>';
      }
    });
  </script>
</body>
</html>
