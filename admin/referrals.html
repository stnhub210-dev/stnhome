<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>할인코드 관리 | STN 관리자</title>
  <link rel="icon" type="image/x-icon" href="/image/favicon-512x512-256.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <img src="/image/favicon-512x512.png" alt="STN">
        <div>
          <strong>STN Admin</strong>
          <span>스킬업 운영</span>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="관리자 메뉴">
        <a class="nav-item" href="dashboard.html">결제 신청 관리</a>
        <a class="nav-item" href="referrer-submissions.html">추천인 코드 신청자</a>
        <a class="nav-item is-active" href="referrals.html">할인코드 관리</a>
        <a class="nav-item" href="visitors.html">방문자 통계</a>
        <a class="nav-item" href="../index.html" target="_blank" rel="noopener noreferrer">사이트 보기</a>
      </nav>

      <div class="sidebar-footer">
        <div id="admin-user-email">-</div>
        <button type="button" class="btn btn-ghost" id="logout-btn" style="width:100%; margin-top:10px;">로그아웃</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <h2>할인코드 관리</h2>
          <p>할인 코드를 발급하고 사용 현황을 관리합니다.</p>
        </div>
        <div class="admin-topbar-actions">
          <button type="button" class="btn btn-ghost" id="refresh-btn">새로고침</button>
          <button type="button" class="btn btn-ghost" data-logout>로그아웃</button>
        </div>
      </header>

      <section class="panel form-panel">
        <div class="panel-head">
          <h3>새 추천인 코드 발급</h3>
        </div>
        <form id="referral-form" class="admin-form">
          <div class="form-grid">
            <div class="field">
              <label for="ref-code">코드<span class="req">*</span></label>
              <div class="input-with-btn">
                <input class="field-input" type="text" id="ref-code" name="code" placeholder="예: STN2026" maxlength="20" required>
                <button type="button" class="btn btn-ghost btn-sm" id="btn-gen-code">자동생성</button>
              </div>
            </div>
            <div class="field">
              <label for="ref-label">추천인명<span class="req">*</span></label>
              <input class="field-input" type="text" id="ref-label" name="label" placeholder="예: 김강사" required>
            </div>
            <div class="field">
              <label for="ref-discount-type">할인 방식<span class="req">*</span></label>
              <select class="field-input" id="ref-discount-type" name="discount_type" required>
                <option value="percent">퍼센트 할인 (%)</option>
                <option value="fixed">정액 할인 (원)</option>
              </select>
            </div>
            <div class="field">
              <label for="ref-discount-value">할인 값<span class="req">*</span></label>
              <input class="field-input" type="number" id="ref-discount-value" name="discount_value" min="1" placeholder="10 또는 50000" required>
            </div>
            <div class="field">
              <label for="ref-max-uses">최대 사용 횟수</label>
              <input class="field-input" type="number" id="ref-max-uses" name="max_uses" min="1" placeholder="비우면 무제한">
            </div>
            <div class="field">
              <label for="ref-valid-from">시작일</label>
              <div class="date-input-wrap">
                <input class="field-input date-input" type="date" id="ref-valid-from" name="valid_from">
                <button type="button" class="date-open-btn" aria-label="시작일 달력 열기" data-for="ref-valid-from">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
                    <path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                  </svg>
                </button>
              </div>
            </div>
            <div class="field">
              <label for="ref-valid-until">만료일</label>
              <div class="date-input-wrap">
                <input class="field-input date-input" type="date" id="ref-valid-until" name="valid_until">
                <button type="button" class="date-open-btn" aria-label="만료일 달력 열기" data-for="ref-valid-until">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
                    <path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                  </svg>
                </button>
              </div>
            </div>
            <div class="field field-full">
              <label for="ref-notes">메모</label>
              <input class="field-input" type="text" id="ref-notes" name="notes" placeholder="내부 메모 (선택)">
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">코드 발급</button>
            <p id="form-message" class="form-message" hidden></p>
          </div>
        </form>
      </section>

      <section class="panel" style="margin-top:18px;">
        <div class="panel-head panel-head-tabs">
          <h3>발급된 코드 목록</h3>
          <span class="panel-meta" id="list-meta">-</span>
        </div>
        <div class="bulk-toolbar" id="referrals-bulk-toolbar">
          <p class="bulk-toolbar-meta" id="bulk-selection-meta">선택 <strong>0</strong>건</p>
          <div class="bulk-toolbar-actions">
            <button type="button" class="btn btn-ghost btn-sm" id="bulk-activate-btn" disabled>선택 활성화</button>
            <button type="button" class="btn btn-ghost btn-sm" id="bulk-deactivate-btn" disabled>선택 비활성화</button>
            <button type="button" class="btn btn-ghost btn-sm btn-danger" id="bulk-delete-btn" disabled>선택 삭제</button>
          </div>
        </div>
        <div class="table-wrap" data-allow-select>
          <table class="data-table">
            <thead>
              <tr>
                <th class="table-check-col" scope="col">
                  <input type="checkbox" id="select-all-referrals" aria-label="현재 페이지 전체 선택">
                </th>
                <th>코드</th>
                <th>추천인명</th>
                <th>할인</th>
                <th>사용</th>
                <th>시작일</th>
                <th>만료일</th>
                <th>상태</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="referrals-body">
              <tr><td colspan="9" class="table-empty">불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="referrals-pagination" hidden aria-label="코드 목록 페이지">
          <button type="button" class="page-btn" id="page-prev">이전</button>
          <div class="page-numbers" id="page-numbers"></div>
          <button type="button" class="page-btn" id="page-next">다음</button>
        </div>
      </section>
    </main>
  </div>

  <div class="admin-modal" id="referral-edit-modal" hidden aria-hidden="true" role="dialog" aria-labelledby="edit-modal-title">
    <div class="admin-modal-backdrop" data-close-modal></div>
    <div class="admin-modal-panel" role="document">
      <div class="admin-modal-head">
        <div>
          <h3 id="edit-modal-title">할인코드 수정</h3>
          <p class="admin-modal-sub">발급된 할인코드 정보를 변경합니다. 코드 문자열은 수정할 수 없습니다.</p>
        </div>
        <button type="button" class="admin-modal-close" aria-label="닫기" data-close-modal>&times;</button>
      </div>
      <form id="referral-edit-form" class="admin-form admin-modal-body">
        <input type="hidden" id="edit-id" name="id">
        <div class="form-grid">
          <div class="field">
            <label for="edit-code">코드</label>
            <input class="field-input" type="text" id="edit-code" readonly>
          </div>
          <div class="field">
            <label for="edit-used-count">현재 사용 횟수</label>
            <input class="field-input" type="text" id="edit-used-count" readonly>
          </div>
          <div class="field">
            <label for="edit-label">추천인명<span class="req">*</span></label>
            <input class="field-input" type="text" id="edit-label" name="label" required>
          </div>
          <div class="field">
            <label for="edit-discount-type">할인 방식<span class="req">*</span></label>
            <select class="field-input" id="edit-discount-type" name="discount_type" required>
              <option value="percent">퍼센트 할인 (%)</option>
              <option value="fixed">정액 할인 (원)</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-discount-value">할인 값<span class="req">*</span></label>
            <input class="field-input" type="number" id="edit-discount-value" name="discount_value" min="1" required>
          </div>
          <div class="field">
            <label for="edit-max-uses">최대 사용 횟수</label>
            <input class="field-input" type="number" id="edit-max-uses" name="max_uses" min="1" placeholder="비우면 무제한">
          </div>
          <div class="field">
            <label for="edit-valid-from">시작일</label>
            <div class="date-input-wrap">
              <input class="field-input date-input" type="date" id="edit-valid-from" name="valid_from">
              <button type="button" class="date-open-btn" aria-label="시작일 달력 열기" data-for="edit-valid-from">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
                  <path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                </svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="edit-valid-until">만료일</label>
            <div class="date-input-wrap">
              <input class="field-input date-input" type="date" id="edit-valid-until" name="valid_until">
              <button type="button" class="date-open-btn" aria-label="만료일 달력 열기" data-for="edit-valid-until">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
                  <path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                </svg>
              </button>
            </div>
          </div>
          <div class="field field-full">
            <label for="edit-notes">메모</label>
            <input class="field-input" type="text" id="edit-notes" name="notes" placeholder="내부 메모 (선택)">
          </div>
          <div class="field field-full">
            <label class="checkbox-label">
              <input type="checkbox" id="edit-is-active" name="is_active">
              코드 활성화
            </label>
          </div>
        </div>
        <div class="form-actions admin-modal-actions">
          <button type="button" class="btn btn-ghost" data-close-modal>취소</button>
          <button type="submit" class="btn btn-primary" id="edit-submit-btn">저장</button>
          <p id="edit-form-message" class="form-message" hidden></p>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/admin-shell.js"></script>
  <script src="assets/js/date-picker.js"></script>
  <script src="assets/js/referrals.js"></script>
  <script>
    window.stnAdminReferrals.init().catch(function (err) {
      console.error(err);
    });
  </script>
  <script src="/js/site-protection.js"></script>
</body>
</html>
